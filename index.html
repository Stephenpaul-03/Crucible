<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="system-favicon" rel="icon" type="image/x-icon" href="/src/assets/icon-light.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Stephen" />
    <meta name="description" content="I’m Stephen, and I use Crucible to document my hardware builds, experiments, failures, and fixes." />
    <title>Crucible</title>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("crucible-ui-theme")
          const theme = storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          document.documentElement.classList.add(theme)
          document.documentElement.style.backgroundColor = theme === "dark" ? "#09090b" : "#ffffff"
        } catch {
          // React will apply the theme after startup if storage is unavailable.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
